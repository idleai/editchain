[package]
publish = false
name = "editchain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface to the shared EditChain engine APIs"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
editchain-cli-support = { registry = "idle-editchain", version = "0.1.6", path = "../editchain-cli-support" }
editchain-engine = { registry = "idle-editchain", version = "0.1.6", path = "../editchain-engine" }
editchain-index = { registry = "idle-editchain", version = "0.1.6", path = "../editchain-index" }
editchain-store = { registry = "idle-editchain", version = "0.1.6", path = "../editchain-store" }
editchain-sync = { registry = "idle-editchain", version = "0.1.6", path = "../editchain-sync" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
