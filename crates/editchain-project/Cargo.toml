[package]
name = "editchain-project"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
editchain-engine = { path = "../editchain-engine" }
editchain-index = { path = "../editchain-index" }
editchain-core = { path = "../editchain-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
editchain-import = { path = "../editchain-import" }
editchain-store = { path = "../editchain-store" }
blake3 = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
