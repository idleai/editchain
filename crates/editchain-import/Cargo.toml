[package]
name = "editchain-import"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
editchain-store = { path = "../editchain-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["parsing"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
editchain-core = { path = "../editchain-core" }
editchain-codec = { path = "../editchain-codec" }

[dev-dependencies]
proptest = "1"
editchain-project = { path = "../editchain-project" }
