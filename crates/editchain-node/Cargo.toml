[package]
name = "editchain-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "6"
editchain-core = { path = "../editchain-core" }
editchain-codec = { path = "../editchain-codec" }
editchain-store = { path = "../editchain-store" }
editchain-import = { path = "../editchain-import" }
editchain-git = { path = "../editchain-git" }
editchain-vscode-service = { path = "../editchain-vscode-service" }

[dev-dependencies]
tempfile = "3"
