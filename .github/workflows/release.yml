name: Release
on:
  workflow_run:
    workflows: [Lint]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: release-plz@0.3.169,cargo-semver-checks@0.50.0
      - name: Prepare or resume the version commit
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh auth setup-git
          python3 scripts/release-automation.py prepare --source "$SOURCE_COMMIT"

  verify:
    needs: prepare
    if: needs.prepare.outputs.revision != ''
    uses: ./.github/workflows/lint.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      artifact_tag: ${{ steps.artifact.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        with:
          command: release
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or resume Cargo archives and index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release-crates.py --publish
      - name: Select unfinished artifact release
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git fetch origin --tags
          python3 scripts/release-automation.py artifact --package editchain

  artifacts:
    needs: publish
    if: needs.publish.outputs.artifact_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/native-release.yml
    with:
      tag: ${{ needs.publish.outputs.artifact_tag }}
