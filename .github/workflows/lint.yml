name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Commit to validate before publication
        required: true
        type: string

concurrency:
  group: ci-checks::${{ github.workflow }}::${{ inputs.revision || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 15 }}
    defaults:
      run:
        working-directory: editchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: editchain
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s scripts -p 'test_release_automation.py'

  lint:
    needs: preflight
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.IDLE_LINUX_RUNNER || github.event_name != 'pull_request' && vars.IDLE_BACKGROUND_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 7 || 45 }}
    defaults:
      run:
        working-directory: editchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: editchain
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Install rustup on the local runner
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add clippy rustfmt

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            editchain/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('editchain/Cargo.lock') }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Rust quality checks
        run: bash scripts/lint.sh

  required:
    name: CI required
    if: always()
    needs: [preflight, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the Linux checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["NEEDS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          print("All checks passed.")
          PY
      - uses: idleai/codex-evo/.github/actions/check-pr-budget@idle-base
        if: always() && github.event_name == 'pull_request'
        with:
          token: ${{ github.token }}
